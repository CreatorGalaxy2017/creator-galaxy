<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Creator Galaxy</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <h1 class="title">Creator Galaxy</h1>
  <canvas id="game-canvas"></canvas>
  <div class="controls" aria-label="Star the Fox movement controls">
    <button class="ctrl ctrl-up"    data-action="fwd"   aria-label="Walk forward">&#9650;</button>
    <button class="ctrl ctrl-left"  data-action="left"  aria-label="Turn left">&#9664;</button>
    <button class="ctrl ctrl-right" data-action="right" aria-label="Turn right">&#9654;</button>
    <button class="ctrl ctrl-down"  data-action="back"  aria-label="Walk backward">&#9660;</button>
  </div>
  <p class="hint">Arrow keys / WASD &middot; or tap the buttons</p>
  <script type="module" src="js/main.js"></script>
</body>
</html>
